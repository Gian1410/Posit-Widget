<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posit</title>
    <link rel="icon" type="image/svg+xml" href="assets/posit-icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="posit-shell" data-theme="cream">
      <header class="topbar">
        <div class="brand-area" title="Arrastra para mover">
          <div class="brand-mark" aria-hidden="true"><img src="assets/posit-icon.svg" alt="" /></div>
        </div>

        <div class="window-actions" aria-label="Controles de ventana">
          <button id="more-actions" class="icon-button more-button" type="button" aria-label="Más opciones" aria-expanded="false" title="Más opciones">
            <span class="more-dots" aria-hidden="true">•••</span>
          </button>
          <button class="icon-button minimize-button" aria-label="Minimizar" title="Minimizar">
            <span></span>
          </button>
          <button class="icon-button close-button" aria-label="Cerrar" title="Cerrar">
            <span></span>
          </button>
        </div>
      </header>

      <div id="font-menu" class="font-menu" hidden>
        <div class="font-menu-heading">
          <span>Tamaño de toda la nota</span>
          <strong id="font-size-value">16 px</strong>
        </div>
        <input id="font-size-range" class="font-size-range" type="range" min="8" max="24" step="1" value="16" aria-label="Tamaño de fuente" />
        <div class="font-size-hints" aria-hidden="true"><span>A</span><span>A</span><span>A</span></div>
        <div class="font-family-tools">
          <span class="selection-label">Tipografía de la nota</span>
          <div class="font-family-options" role="group" aria-label="Elegir tipografía">
            <button class="font-family-button" type="button" data-font-family="handwritten">Original</button>
            <button class="font-family-button" type="button" data-font-family="arial">Arial</button>
            <button class="font-family-button" type="button" data-font-family="aptos">Aptos</button>
          </div>
        </div>
        <div class="selection-tools">
          <span class="selection-label">Texto seleccionado</span>
          <div class="selection-actions">
            <button class="format-button format-bold" type="button" data-command="bold" title="Negrita"><strong>B</strong></button>
            <button class="format-button format-italic" type="button" data-command="italic" title="Cursiva"><em>I</em></button>
            <button class="format-button format-list" type="button" data-command="insertUnorderedList" title="Viñetas">•</button>
            <div class="selection-size-picker">
              <button id="selection-size-toggle" class="selection-size" type="button" aria-expanded="false" aria-controls="selection-size-menu" title="Tamaño del texto seleccionado">
                <span>Tamaño</span>
                <span class="select-chevron" aria-hidden="true"></span>
              </button>
              <div id="selection-size-menu" class="selection-size-menu" hidden>
                <button type="button" data-size="2">Pequeño</button>
                <button type="button" data-size="3">Normal</button>
                <button type="button" data-size="5">Grande</button>
                <button type="button" data-size="6">Muy grande</button>
              </div>
            </div>
          </div>
        </div>
        <button id="new-posit" class="new-posit-action" type="button">
          <span class="new-posit-plus" aria-hidden="true">+</span>
          <span>Crear nuevo posit</span>
        </button>
      </div>

      <section class="note-content">
        <div id="note-body" class="note-body" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Escribe algo para no olvidarlo..." aria-label="Nota"></div>
      </section>

      <div id="highlight-menu" class="highlight-menu" hidden role="menu" aria-label="Resaltar texto">
        <button id="increase-selection-size" class="context-format-action" type="button" role="menuitem">
          <span class="context-format-icon" aria-hidden="true">A+</span>
          <span>Aumentar tamaño</span>
        </button>
        <button id="decrease-selection-size" class="context-format-action" type="button" role="menuitem">
          <span class="context-format-icon context-format-icon-small" aria-hidden="true">A−</span>
          <span>Reducir tamaño</span>
        </button>
        <button id="remove-highlight" class="context-format-action" type="button" role="menuitem">
          <span class="context-format-icon context-format-icon-remove" aria-hidden="true">×</span>
          <span>Quitar resaltado</span>
        </button>
        <div class="context-menu-divider"></div>
        <span>Resaltar</span>
        <div class="highlight-actions" role="group" aria-label="Color de resaltado">
          <button class="highlight-swatch highlight-cream" type="button" data-highlight="#f2e7bb" title="Resaltado crema" aria-label="Resaltado crema"></button>
          <button class="highlight-swatch highlight-lavender" type="button" data-highlight="#e4dcf1" title="Resaltado lavanda" aria-label="Resaltado lavanda"></button>
          <button class="highlight-swatch highlight-peach" type="button" data-highlight="#f4dfd1" title="Resaltado durazno" aria-label="Resaltado durazno"></button>
        </div>
      </div>

      <footer class="note-footer">
        <div class="footer-left">
          <span class="save-state"><span class="save-dot"></span><span id="save-label">Guardado</span></span>
        </div>

        <div class="footer-actions">
          <div class="theme-picker" aria-label="Elegir color de la nota">
            <button class="theme-dot theme-dot-cream is-selected" type="button" data-theme="cream" aria-label="Color crema" aria-pressed="true"></button>
            <button class="theme-dot theme-dot-lavender" type="button" data-theme="lavender" aria-label="Color lavanda" aria-pressed="false"></button>
            <button class="theme-dot theme-dot-peach" type="button" data-theme="peach" aria-label="Color durazno" aria-pressed="false"></button>
          </div>

          <button id="open-note" class="save-control" type="button" title="Abrir un archivo de texto">
            <svg class="action-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M3 6.5h6l2 2h10v10.5H3V6.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M3 9h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M12 14v-5m0 0-2 2m2-2 2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Abrir</span>
          </button>

          <button id="save-note" class="save-control" type="button" title="Guardar esta nota en un archivo">
            <svg class="action-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M5 3h11l3 3v15H5V3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M8 3v6h8V3M8 16h8v5H8v-5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Guardar</span>
          </button>

          <button id="pin-toggle" class="pin-control is-active" type="button" aria-pressed="true" title="Activar o desactivar siempre arriba">
            <span class="pin-icon" aria-hidden="true">⌖</span>
            <span>Siempre arriba</span>
          </button>
        </div>
      </footer>

      <div class="resize-handle resize-n" data-resize="n" aria-hidden="true"></div>
      <div class="resize-handle resize-ne" data-resize="ne" aria-hidden="true"></div>
      <div class="resize-handle resize-e" data-resize="e" aria-hidden="true"></div>
      <div class="resize-handle resize-se" data-resize="se" aria-hidden="true"></div>
      <div class="resize-handle resize-s" data-resize="s" aria-hidden="true"></div>
      <div class="resize-handle resize-sw" data-resize="sw" aria-hidden="true"></div>
      <div class="resize-handle resize-w" data-resize="w" aria-hidden="true"></div>
      <div class="resize-handle resize-nw" data-resize="nw" aria-hidden="true"></div>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
